name: Population Reporting CI

on:
  push:
  pull_request:
    branches:
      - develop
      - master
      - release

permissions:
  contents: read

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Unit Tests
        run: mvn -Dtest="com.napier.population.reports.*Test" test

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build database image
        run: docker build -t database ./db

      - name: Start database
        run: docker run --name world-db -d -p 33060:3306 -e MYSQL_ROOT_PASSWORD=example database

      - name: Run Integration Tests
        run: mvn -Dtest=com.napier.population.AppIntegrationTest test

      - name: Show database logs
        if: always()
        run: docker logs world-db

      - name: Clean up database
        if: always()
        run: |
          docker stop world-db || true
          docker rm world-db || true

  build:
      name: Build and Start Using Docker Compose
      runs-on: ubuntu-24.04
      timeout-minutes: 15

      steps:
        - name: Checkout repository
          uses: actions/checkout@v5

        - name: Set up Java 17
          uses: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: '17'
            cache: maven

        - name: Build with Maven
          run: mvn --batch-mode clean package -DskipTests

        - name: Validate Docker Compose
          run: docker compose config --quiet

        - name: Build Docker containers
          run: docker compose build

        - name: Start MySQL
          run: docker compose up -d db

        - name: Run application
          run: printf "1\n0\n" | docker compose run --rm -T app

        - name: Show container logs
          if: always()
          run: docker compose logs --no-color

        - name: Clean up containers
          if: always()
          run: docker compose down --volumes --remove-orphans
